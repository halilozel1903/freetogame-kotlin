<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0F17"/>
      <stop offset="0.55" stop-color="#0F2129"/>
      <stop offset="1" stop-color="#11433F"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121A26"/>
      <stop offset="1" stop-color="#0B0F17"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F6F69"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#121A26"/>
      <stop offset="0.45" stop-color="#121A26" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#121A26" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B4A6B"/><stop offset="1" stop-color="#6C7FA8"/></linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6B3B4A"/><stop offset="1" stop-color="#C27A6A"/></linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B6B4F"/><stop offset="1" stop-color="#8FCB8A"/></linearGradient>
    <linearGradient id="c4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5A4A2A"/><stop offset="1" stop-color="#FFC266"/></linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1120" cy="80" r="220" fill="#5EEAD4" opacity="0.06"/>
  <circle cx="980" cy="600" r="180" fill="#FFC266" opacity="0.05"/>

  <!-- Title block -->
  <text x="80" y="206" font-family="Inter, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#F1F4F9">freetogame-kotlin</text>
  <text x="82" y="262" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#A6B0C3">Kotlin client for the FreeToGame API,</text>
  <text x="82" y="298" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#A6B0C3">with an Android TV game browser</text>

  <!-- Feature chips -->
  <g font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600">
    <rect x="80" y="340" width="152" height="44" rx="22" fill="#5EEAD4" opacity="0.16"/>
    <text x="156" y="369" text-anchor="middle" fill="#5EEAD4">Coroutines</text>
    <rect x="244" y="340" width="219" height="44" rx="22" fill="#5EEAD4" opacity="0.16"/>
    <text x="354" y="369" text-anchor="middle" fill="#5EEAD4">Multi-tag filter</text>
    <rect x="475" y="340" width="140" height="44" rx="22" fill="#5EEAD4" opacity="0.16"/>
    <text x="545" y="369" text-anchor="middle" fill="#5EEAD4">Platforms</text>
    <rect x="80" y="396" width="163" height="44" rx="22" fill="#FFC266" opacity="0.16"/>
    <text x="162" y="425" text-anchor="middle" fill="#FFC266">Screenshots</text>
    <rect x="255" y="396" width="252" height="44" rx="22" fill="#FFC266" opacity="0.16"/>
    <text x="381" y="425" text-anchor="middle" fill="#FFC266">System requirements</text>
    <rect x="80" y="452" width="196" height="44" rx="22" fill="#FFFFFF" opacity="0.08"/>
    <text x="178" y="481" text-anchor="middle" fill="#F1F4F9">Compose for TV</text>
    <rect x="288" y="452" width="118" height="44" rx="22" fill="#FFFFFF" opacity="0.08"/>
    <text x="347" y="481" text-anchor="middle" fill="#F1F4F9">JitPack</text>
  </g>
  <text x="82" y="560" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#6F7A8F">Data provided by FreeToGame.com</text>

  <!-- TV illustration -->
  <g transform="translate(700 120) scale(0.94)">
    <rect x="0" y="0" width="560" height="340" rx="18" fill="#05070B"/>
    <rect x="12" y="12" width="536" height="316" rx="10" fill="url(#screen)"/>
    <!-- Hero -->
    <rect x="196" y="12" width="352" height="150" rx="0" fill="url(#hero)" opacity="0.9"/>
    <path d="M196 162 L270 92 L320 132 L380 70 L470 162 Z" fill="#0B0F17" opacity="0.35"/>
    <circle cx="470" cy="56" r="18" fill="#FFC266" opacity="0.9"/>
    <rect x="12" y="12" width="420" height="150" fill="url(#fade)"/>
    <rect x="36" y="44" width="80" height="8" rx="4" fill="#5EEAD4"/>
    <rect x="36" y="62" width="170" height="16" rx="8" fill="#F1F4F9"/>
    <rect x="36" y="88" width="140" height="8" rx="4" fill="#A6B0C3" opacity="0.7"/>
    <rect x="36" y="104" width="120" height="8" rx="4" fill="#A6B0C3" opacity="0.5"/>
    <rect x="36" y="124" width="64" height="22" rx="11" fill="#5EEAD4"/>
    <rect x="108" y="124" width="76" height="22" rx="11" fill="#FFFFFF" opacity="0.12"/>
    <!-- Platform chips -->
    <rect x="410" y="26" width="40" height="14" rx="7" fill="#5EEAD4"/>
    <rect x="456" y="26" width="40" height="14" rx="7" fill="#FFFFFF" opacity="0.15"/>
    <rect x="502" y="26" width="34" height="14" rx="7" fill="#FFFFFF" opacity="0.15"/>
    <!-- Rail 1 -->
    <rect x="36" y="176" width="90" height="8" rx="4" fill="#F1F4F9" opacity="0.8"/>
    <rect x="36" y="194" width="104" height="58" rx="8" fill="url(#c1)"/>
    <rect x="150" y="190" width="112" height="66" rx="8" fill="url(#c2)" stroke="#F1F4F9" stroke-width="3"/>
    <rect x="272" y="194" width="104" height="58" rx="8" fill="url(#c3)"/>
    <rect x="386" y="194" width="104" height="58" rx="8" fill="url(#c4)"/>
    <rect x="500" y="194" width="48" height="58" rx="8" fill="url(#c1)" opacity="0.7"/>
    <!-- Rail 2 -->
    <rect x="36" y="268" width="70" height="8" rx="4" fill="#F1F4F9" opacity="0.6"/>
    <rect x="36" y="284" width="104" height="44" rx="8" fill="url(#c4)" opacity="0.8"/>
    <rect x="150" y="284" width="104" height="44" rx="8" fill="url(#c3)" opacity="0.8"/>
    <rect x="264" y="284" width="104" height="44" rx="8" fill="url(#c1)" opacity="0.8"/>
    <rect x="378" y="284" width="104" height="44" rx="8" fill="url(#c2)" opacity="0.8"/>
    <rect x="492" y="284" width="56" height="44" rx="8" fill="url(#c3)" opacity="0.6"/>
    <!-- Stand -->
    <rect x="250" y="340" width="60" height="22" fill="#05070B"/>
    <rect x="190" y="360" width="180" height="10" rx="5" fill="#05070B"/>
  </g>

  <!-- Controller -->
  <g transform="translate(1010 450) rotate(-12) scale(0.8)">
    <path d="M40 0 h120 a46 46 0 0 1 46 46 v10 a46 46 0 0 1 -46 46 c-18 0 -24 -14 -40 -14 h-40 c-16 0 -22 14 -40 14 a46 46 0 0 1 -46 -46 v-10 a46 46 0 0 1 46 -46 z" fill="#5EEAD4"/>
    <path d="M30 34 h14 v14 h14 v14 h-14 v14 h-14 v-14 h-14 v-14 h14 z" fill="#0B0F17"/>
    <circle cx="160" cy="40" r="9" fill="#0B0F17"/>
    <circle cx="142" cy="58" r="9" fill="#0B0F17"/>
    <circle cx="178" cy="58" r="9" fill="#FFC266"/>
  </g>
</svg>
